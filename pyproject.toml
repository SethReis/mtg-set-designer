[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setdesigner"
version = "0.1.0"
description = "Set-first designer for custom Magic: The Gathering sets (unofficial fan tool)"
requires-python = ">=3.11"
license = "GPL-2.0-only"
authors = [{ name = "Seth Reis" }]
dependencies = [
    "nicegui",
    "pywebview",        # nicegui's native mode: the app's own desktop window
    "pydantic>=2",
    "pillow",
    "numpy",            # pixel math for MSE's image functions
    "regex",            # MSE scripts use Perl regex features Python's re lacks ([[:space:]])
    "fonttools",        # font names (family / PostScript) for matching stylesheet fonts
    "reportlab",        # print export: the PDF sheets
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]     # pytest-asyncio: NiceGUI's simulated-user UI tests
svg = ["cairosvg"]      # SVG set symbols (PNG works without it)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"setdesigner.ui.theme" = ["*.css", "fonts/*"]     # the theme's stylesheets and bundled fonts

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p nicegui.testing.user_plugin"     # the `user` fixture for UI tests
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = ""
