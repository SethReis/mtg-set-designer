[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setdesigner"
version = "0.1.0"
description = "Set-first designer for custom Magic: The Gathering sets (private, personal use)"
requires-python = ">=3.11"
dependencies = [
    "nicegui",
    "pydantic>=2",
    "pillow",
    "numpy",            # pixel math for MSE's image functions
    "regex",            # MSE scripts use Perl regex features Python's re lacks ([[:space:]])
    "fonttools",        # font names (family / PostScript) for matching stylesheet fonts
]

[project.optional-dependencies]
dev = ["pytest"]
svg = ["cairosvg"]      # SVG set symbols (PNG works without it)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
